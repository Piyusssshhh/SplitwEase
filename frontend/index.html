<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplitEase</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="brand-mark">S</div>
      <h1>SplitEase</h1>
    </div>
    <p class="subtitle" id="pageSubtitle">Log in to manage your shared expenses</p>

    <div class="card">
      <div id="nameField" style="display: none;">
        <label for="name">Your name</label>
        <input type="text" id="name" placeholder="Piyush Kumar">
      </div>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 8 characters">

      <button id="submitBtn">Log In</button>

      <div class="error" id="errorBox"></div>

      <div class="divider">or</div>

      <a href="#" id="googleBtn" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9C16.66 14.2 17.64 11.9 17.64 9.2z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.36 0-4.36-1.6-5.08-3.74H.9v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.92 10.68A5.4 5.4 0 0 1 3.64 9c0-.58.1-1.15.28-1.68V4.99H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.01l3.02-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.99l3.02 2.33C4.64 5.18 6.64 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </a>
    </div>

    <div class="toggle-link" id="toggleLink">Don't have an account? Sign up</div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
